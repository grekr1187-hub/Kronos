name: Paper bot safety tests

on:
  push:
    paths:
      - "trading_bot/**"
      - ".github/workflows/paper-bot-tests.yml"
  pull_request:
    paths:
      - "trading_bot/**"
      - ".github/workflows/paper-bot-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip ccxt "pandas>=2.2.0" "python-dotenv>=1.0.1"
      - name: Run unit tests
        run: python -m unittest trading_bot.test_paper_bot trading_bot.test_backtest_engine -v
      - name: Compile Python files
        run: python -m compileall -q trading_bot
